<title>자동차 기록 · THE YEARS</title><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#142019"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="THE YEARS"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><script defer src="js/pwa.js"></script></head>

<section class="card" style="margin-top:20px"><div class="kicker">CAR</div><h2>자동차 기록</h2><div id="list" class="latest-grid"></div></section><div class="footer">THE YEARS</div></div>
<script>
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.addEventListener("DOMContentLoaded",async()=>{
 const el=document.querySelector("#list"); const b=(SITE_CONFIG.apiBase||"").replace(/\/$/,"");
 if(!b){el.innerHTML='<div class="empty">API 연결 후 작성한 글이 여기에 표시됩니다.</div>';return}
 try{const r=await fetch(b+"/api/posts?category=CAR&limit=100");const d=await r.json();el.innerHTML=(d.posts||[]).map(p=>`<a class="post-card" href="post.html?id=${p.id}">${p.cover_url?`<img class="post-thumb" src="${esc(p.cover_url)}" alt="">`:`<div class="post-thumb"></div>`}<div class="post-body"><div class="meta">${esc(p.post_date)}</div><h3>${esc(p.title)}</h3></div></a>`).join("")||'<div class="empty">아직 기록이 없습니다.</div>'}catch(e){el.innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>'}
});
</script></body></html>
