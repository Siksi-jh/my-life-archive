<section class="card" style="margin-top:20px">
<div class="kicker">CAR</div><h2>자동차</h2><div id="list" class="latest-grid"></div>
</section><div class="footer">THE YEARS</div></div>
<script>
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.addEventListener("DOMContentLoaded",async()=>{
 const el=document.querySelector("#list"), b=(SITE_CONFIG.apiBase||"").replace(/\/$/,"");
 if(!b){el.innerHTML='<div class="empty">API 연결을 확인하세요.</div>';return}
 try{
  const r=await fetch(b+"/api/posts?category=CAR&limit=100");
  const d=await r.json();
  el.innerHTML=(d.posts||[]).map(p=>`<a class="post-card" href="post.html?id=${p.id}">${p.cover_url?`<img class="post-thumb" src="${esc(p.cover_url)}" alt="">`:`<div class="post-thumb"></div>`}<div class="post-body"><div class="meta">${esc(p.post_date)}</div><h3>${esc(p.title)}</h3></div></a>`).join("")||'<div class="empty">아직 공개 기록이 없습니다.</div>'
 }catch(e){el.innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>'}
});
</script></body></html>
