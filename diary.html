<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIARY · THE YEARS</title><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script></head>
<body><div class="shell"><nav class="nav"><a href="index.html">HOME</a><a class="active" href="diary.html">DIARY</a><a href="travel.html">TRAVEL</a><a href="photo.html">PHOTO</a><a href="car.html">CAR</a><a href="study.html">STUDY</a><a href="archive.html">ARCHIVE</a><span class="spacer"></span><a href="admin/">ADMIN</a></nav>
<section class="card" style="margin-top:20px"><div class="kicker">Journal</div><h2 id="heading">DIARY</h2><div id="list" class="latest-grid"></div></section></div>
<script>
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.addEventListener("DOMContentLoaded",async()=>{
 const qs=new URLSearchParams(location.search), year=qs.get("year"), el=document.querySelector("#list");
 if(year)document.querySelector("#heading").textContent=`${year}년 기록`;
 const b=(SITE_CONFIG.apiBase||"").replace(/\/$/,"");if(!b){el.innerHTML='<div class="empty">API 연결 후 관리자에서 작성한 일기가 표시됩니다.</div>';return}
 const q=new URLSearchParams({category:"DIARY",limit:"200"});if(year)q.set("year",year);
 try{const r=await fetch(b+"/api/posts?"+q);const d=await r.json();el.innerHTML=(d.posts||[]).map(p=>`<a class="post-card" href="post.html?id=${p.id}">${p.cover_url?`<img class="post-thumb" src="${esc(p.cover_url)}" alt="">`:`<div class="post-thumb"></div>`}<div class="post-body"><div class="meta">${esc(p.post_date)}</div><h3>${esc(p.title)}</h3></div></a>`).join("")||'<div class="empty">아직 기록이 없습니다.</div>'}catch(e){el.innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>'}
});
</script></body></html>
