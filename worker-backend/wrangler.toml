name = "the-years-api"
main = "src/index.js"
compatibility_date = "2026-10-20"

[vars]
FRONTEND_ORIGIN = "https://my-life-archive-8mc.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "the-years-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "the-years-media"
