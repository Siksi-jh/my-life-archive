<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE YEARS</title><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#142019"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="THE YEARS"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><script defer src="js/pwa.js"></script></head><body>
<div class="shell"><nav class="nav"><a href="index.html">HOME</a><a href="diary.html">DIARY</a><a href="travel.html">TRAVEL</a><a href="photo.html">PHOTO</a><a href="car.html">CAR</a><a href="study.html">STUDY</a><a href="archive.html">ARCHIVE</a></nav>
<article id="article" class="article"><div class="empty">불러오는 중...</div></article></div>
<script>
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.addEventListener("DOMContentLoaded",async()=>{
 const id=new URLSearchParams(location.search).get("id"), b=(SITE_CONFIG.apiBase||"").replace(/\/$/,""), el=document.querySelector("#article");
 if(!id||!b){el.innerHTML='<div class="empty">글을 찾을 수 없습니다.</div>';return}
 try{const r=await fetch(`${b}/api/posts/${encodeURIComponent(id)}`);const p=await r.json();if(!r.ok)throw 0;
 document.title=p.title+" · THE YEARS";el.innerHTML=`<div class="kicker">${esc(p.category)}</div><h1>${esc(p.title)}</h1><div class="meta">${esc(p.post_date)}</div><div class="body">${esc(p.body)}</div>${p.images?.length?`<div class="gallery">${p.images.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`:""}` }catch(e){el.innerHTML='<div class="empty">글을 불러오지 못했습니다.</div>'}
});
</script></body></html>
