<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE YEARS</title><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#142019"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"></head>
<body><div class="shell"><nav class="nav"><a href="index.html">HOME</a><a href="diary.html">DIARY</a><a href="travel.html">TRAVEL</a><a href="photo.html">PHOTO</a><a href="car.html">CAR</a><a href="study.html">STUDY</a><a href="archive.html">ARCHIVE</a></nav>
<article id="article" class="article"><div class="empty">불러오는 중...</div></article></div>
<script>
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
const id=new URLSearchParams(location.search).get("id");
const base=()=> (SITE_CONFIG.apiBase||"").replace(/\/$/,"");
function renderPost(p){
  document.title=p.title+" · THE YEARS";
  document.querySelector("#article").innerHTML=`<div class="kicker">${esc(p.category)}</div><h1>${esc(p.title)}</h1><div class="meta">${esc(p.post_date)}</div><div class="body">${esc(p.body)}</div>${p.images?.length?`<div class="gallery">${p.images.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`:""}`;
}
function renderUnlock(){
  document.querySelector("#article").innerHTML=`
    <div class="private-lock">
      <div class="lock-mark">PRIVATE</div>
      <h1>비공개 기록</h1>
      <p>이 글은 비밀번호가 필요한 개인 기록입니다.</p>
      <div class="private-form"><input id="privatePassword" type="password" placeholder="비밀번호" value=""><button id="unlockBtn" class="btn btn-primary">열기</button></div>
      <div id="unlockStatus" class="status"></div>
    </div>`;
  const savedPw=sessionStorage.getItem("privatePassword")||""; document.querySelector("#privatePassword").value=savedPw;
  document.querySelector("#unlockBtn").onclick=async()=>{
    const st=document.querySelector("#unlockStatus");
    try{
      const r=await fetch(base()+"/api/posts/"+id+"/unlock",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.querySelector("#privatePassword").value})});
      const d=await r.json();if(!r.ok)throw new Error(d.error||"비밀번호가 올바르지 않습니다.");renderPost(d);
    }catch(e){st.textContent=e.message;st.className="status show err"}
  }
}
document.addEventListener("DOMContentLoaded",async()=>{
  const el=document.querySelector("#article");

  const privateMode=new URLSearchParams(location.search).get("private")==="1";

  if(!id||!base()){el.innerHTML='<div class="empty">글을 찾을 수 없습니다.</div>';return}
  try{
    const r=await fetch(base()+"/api/posts/"+encodeURIComponent(id));
    const d=await r.json();
    if(r.status===403&&d.private){
      renderUnlock();
      if(privateMode && sessionStorage.getItem("privatePassword")){
        document.querySelector("#unlockBtn").click();
      }
      return
    }
    if(!r.ok)throw new Error(d.error||"글을 불러오지 못했습니다.");
    renderPost(d);
  }catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
});
</script></body></html>
